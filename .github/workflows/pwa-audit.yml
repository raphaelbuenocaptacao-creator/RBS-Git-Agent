name: RBS Git Agent PWA Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required PWA files
        run: |
          test -f site/agent.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f site/icon-192.png
          test -f site/icon-512.png
          test -f site/icon-512-maskable.png
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('site/manifest.webmanifest', encoding='utf-8'))
          assert m.get('name') and m.get('short_name')
          assert m.get('display') == 'standalone'
          assert m.get('start_url') and m.get('scope')
          icons=m.get('icons', [])
          assert any(i.get('sizes')=='192x192' and i.get('type')=='image/png' for i in icons)
          assert any(i.get('sizes')=='512x512' and i.get('type')=='image/png' for i in icons)
          assert any(i.get('sizes')=='512x512' and 'maskable' in i.get('purpose','') for i in icons)
          PY
      - name: Validate service worker safety
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('site/sw.js').read_text(encoding='utf-8').lower()
          html=Path('site/agent.html').read_text(encoding='utf-8').lower()
          required=[
            "authorization", "cookie", "range", "if-range", "content-range",
            "no-store", "private", "set-cookie", "status === 206",
            "key === 'range'", "key === 'if-range'", "cache_prefix"
          ]
          missing=[x for x in required if x not in sw]
          assert not missing, f'missing SW safety guards: {missing}'
          assert 'serviceworker.register' in html
          assert "updateviacache:'none'" in html.replace(' ', '')
          assert 'beforeinstallprompt' in html
          PY
      - name: Validate service worker version alignment
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          sw=Path('site/sw.js').read_text(encoding='utf-8')
          html=Path('site/agent.html').read_text(encoding='utf-8')
          m=re.search(r"CACHE_NAME\s*=\s*`\$\{CACHE_PREFIX\}([^`]+)`", sw)
          assert m, 'CACHE_NAME version not found'
          version=m.group(1)
          assert f"./sw.js?v={version}" in html, f'registration is not aligned with {version}'
          PY
      - name: Validate service worker refresh and handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('site/agent.html').read_text(encoding='utf-8')
          compact=''.join(html.split()).lower()
          assert 'visibilitychange' in compact, 'missing refresh when app returns to foreground'
          assert "visibilitystate==='visible'" in compact or 'visibilitystate==="visible"' in compact, 'foreground refresh must only run when visible'
          assert 'registration.update()' in compact or '.update()' in compact, 'missing service worker update check'
          assert 'controllerchange' in compact, 'missing service worker controller handoff handling'
          assert 'location.reload()' in compact or 'location.reload(' in compact, 'controller handoff must refresh the running shell'
          PY
      - name: Validate no broad cache deletion
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('site/sw.js').read_text(encoding='utf-8')
          assert 'key.startsWith(CACHE_PREFIX)' in sw
          PY
